<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Symbol Selection Start Screen -->
    <div id="start-screen" class="screen">
        <div class="start-card">
            <h1 class="title">TIC / TAC / TOE</h1>
            <p class="subtitle">SELECT YOUR SYMBOL</p>
            <div class="symbol-options">
                <button class="symbol-btn" data-symbol="X">X</button>
                <button class="symbol-btn" data-symbol="O">O</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
        <div class="game-wrapper">
            <div class="controls-bar">
                <button id="back-btn"class="action-btn back-btn">← BACK</button>
                <button id="restart-btn" class="action-btn restart-btn">RESTART ↺</button>
            </div>
            <div class="board">
                <div><button class="cell"></button></div>
                <div><button class="cell"></button></div>
                <div><button class="cell"></button></div>
                <div><button class="cell"></button></div>
                <div><button class="cell"></button></div>
                <div><button class="cell"></button></div>
                <div><button class="cell"></button></div>
                <div><button class="cell"></button></div>
                <div><button class="cell"></button></div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>

</html>
